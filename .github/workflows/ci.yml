name: ShareSphere CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend PHPUnit (Unit + Integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sharesphere_owner
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: sharesphere_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sharesphere_owner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      APP_ENV: testing
      APP_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: sharesphere_test
      DB_USER: sharesphere_app
      DB_PASS: change-me
      DB_OWNER_USER: sharesphere_owner
      DB_OWNER_PASS: change-me
      OTP_HMAC_KEY: ci-test-hmac-key-only

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, intl
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Create app DB user and grant permissions
        run: |
          PGPASSWORD=change-me psql -h 127.0.0.1 -p 5433 -U sharesphere_owner -d sharesphere_test <<-SQL
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS citext;
            CREATE USER sharesphere_app WITH PASSWORD 'change-me';
            GRANT CONNECT ON DATABASE sharesphere_test TO sharesphere_app;
            GRANT USAGE ON SCHEMA public TO sharesphere_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sharesphere_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sharesphere_app;
          SQL

      - name: Run database migrations
        working-directory: backend
        run: php bin/migrate.php up

      - name: Run Unit Tests
        working-directory: backend
        run: vendor/bin/phpunit --testsuite Unit --colors=never

      - name: Run Integration Tests
        working-directory: backend
        run: vendor/bin/phpunit --testsuite Integration --colors=never

  frontend:
    name: Frontend Vitest + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest tests
        working-directory: frontend
        run: npm run test:run

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
